<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Music Editor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
        }
        h2 { text-align: center; color: #0088cc; margin-bottom: 20px; }
        .card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #bbbbbb; }
        input[type="file"], input[type="range"], select {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .slider-val { text-align: right; font-size: 14px; color: #0088cc; font-weight: bold; }
        button {
            width: 100%;
            padding: 15px;
            background: #0088cc;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #006699; }
    </style>
</head>
<body>

    <h2>🎛 Pro Music Editor</h2>

    <div class="card">
        <label>🎵 1-Musiqa (Asosiy track):</label>
        <input type="file" id="track1" accept="audio/*">

        <label>🎶 2-Musiqa (Mix / Collab track):</label>
        <input type="file" id="track2" accept="audio/*">
        
        <label>🔀 Birlashtirish Rejimi:</label>
        <select id="mixMode">
            <option value="overlay">Ustma-ust miks qilish (Overlay)</option>
            <option value="concat">Ketma-ket ulab berish (Concat)</option>
        </select>
    </div>

    <div class="card">
        <label>🔊 Bass Kuchini Tanlang (dB):</label>
        <input type="range" id="bassGain" min="10" max="60" value="37" oninput="updateVal('bassVal', this.value + ' dB')">
        <div class="slider-val" id="bassVal">37 dB</div>

        <label>🎚 Bass Chastotasi (Frequency):</label>
        <select id="bassFreq">
            <option value="60">60 Hz (Deep Sub-Bass / Qalin)</option>
            <option value="90" selected>90 Hz (Punchy Bass / Aniq va zarbli)</option>
            <option value="120">120 Hz (Mid-Bass / Yengil)</option>
        </select>
    </div>

    <div class="card">
        <label>⚡️ Qo'shimcha Effektlar:</label>
        <select id="effect">
            <option value="none">Yo'q (Faqat Bass Boost)</option>
            <option value="reverb">Reverb (Fazoviy Aks-Sado)</option>
            <option value="speed_fast">Tezlashtirish (1.2x Speed)</option>
            <option value="speed_slow">Sekinlashtirish (0.8x Slowed + Reverb)</option>
        </select>
    </div>

    <button onclick="sendToBot()">🚀 Sozlamalarni Botga Yuborish</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function updateVal(id, val) {
            document.getElementById(id).innerText = val;
        }

        function sendToBot() {
            const data = {
                action: "custom_edit",
                bassGain: document.getElementById('bassGain').value,
                bassFreq: document.getElementById('bassFreq').value,
                mixMode: document.getElementById('mixMode').value,
                effect: document.getElementById('effect').value,
                hasTrack2: document.getElementById('track2').files.length > 0
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
